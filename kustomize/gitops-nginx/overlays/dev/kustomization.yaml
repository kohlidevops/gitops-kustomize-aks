apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: gitops-dev

resources:
  - ../../base

replicas:
  - name: gitops-nginx
    count: 2

images:
  - name: nginx
    newName: acrgitopslab11068.azurecr.io/aks-demo
    newTag: "fc9119d81705440bc76a93222f041ab7fed918cb"

labels:
  - pairs:
      environment: dev
    includeSelectors: false
    includeTemplates: true
