apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: gitops-prod

resources:
  - ../../base
  - namespace.yaml

replicas:
  - name: gitops-nginx
    count: 6

images:
  - name: nginx
    newName: "acrgitopslab11068.azurecr.io/aks-demo"
    newTag: "fc9119d81705440bc76a93222f041ab7fed918cb"

patches:
  - path: service-patch.yaml

labels:
  - pairs:
      environment: prod
