name: CI Pipeline

on:
  push:
    branches:
      - dev
  pull_request:
    branches:
      - dev

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Verify application files
        run: |
          test -f app/Dockerfile
          test -f app/index.html

      - name: Validate Dockerfile
        run: |
          docker build --check ./app
