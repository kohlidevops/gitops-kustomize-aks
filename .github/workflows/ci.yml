name: CI Pipeline

on:
  push:
    branches:
      - dev
  pull_request:
    branches:
      - dev

permissions:
  id-token: write
  contents: read

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout source code
      - name: Checkout source code
        uses: actions/checkout@v4

      # 2. Verify application files
      - name: Verify application files
        run: |
          test -f app/Dockerfile
          test -f app/index.html

      # 3. Validate Dockerfile
      - name: Validate Dockerfile
        run: |
          docker build --check ./app

      # 4. Build Docker image
      - name: Build Docker image
        run: |
          docker build \
            -t aks-demo:${{ github.sha }} \
            ./app

      # 5. Azure login using OIDC
      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # 6. Login to Azure Container Registry
      - name: Login to ACR
        run: |
          az acr login --name acrgitopslab11068

      # 7. Tag image for ACR
      - name: Tag Docker image
        run: |
          docker tag \
            aks-demo:${{ github.sha }} \
            acrgitopslab11068.azurecr.io/aks-demo:${{ github.sha }}

      # 8. Push image to ACR
      - name: Push Docker image
        run: |
          docker push \
            acrgitopslab11068.azurecr.io/aks-demo:${{ github.sha }}
